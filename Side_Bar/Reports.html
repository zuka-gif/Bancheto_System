<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yesunim</title>
    <link href="../Web_Design/Side_Bar.css" rel="stylesheet" />
    <link href="../Web_Design/Reports.css" rel="stylesheet" />
    <link rel="icon" href="../Logo/yesunim.png" type="image/png" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div id="sidebar-container"></div>
    <main>
        <div class="report-tabs">

        <button class="report-tab active"
                onclick="showReport('sales', this)">
            Sales Reports
        </button>

        <button class="report-tab"
                onclick="showReport('inventory', this)">
            Inventory Reports
        </button>

    </div>
    
    <!-- SALES REPORT -->
     <div id="sales" class="report-content"></div>
        
    <!-- INVENTORY REPORT -->
     <div id="inventory" class="report-content" style="display: none;"></div>

    </main>




    <script src="../Javascript/sidebar.js"></script>
    <script src="../Javascript/Reports.js"></script>
</body>
</html>
