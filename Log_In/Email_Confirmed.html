<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email confirmed - Yesunim</title>
    <link rel="icon" href="../Logo/yesunim.png" type="image/png" />
    <style>
        :root {
            --bg: #fff8f1;
            --card: #ffffff;
            --text: #2b2118;
            --muted: #7a6a5c;
            --accent: #f3790f;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1712;
                --card: #262019;
                --text: #f5ece3;
                --muted: #b3a394;
            }
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 380px;
            padding: 44px 32px;
            text-align: center;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .check {
            width: 72px;
            height: 72px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .check svg {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: #fff;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            animation: draw 0.5s 0.15s ease-out forwards;
        }

        @keyframes draw { to { stroke-dashoffset: 0; } }

        @media (prefers-reduced-motion: reduce) {
            .check svg { animation: none; stroke-dashoffset: 0; }
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
            font-weight: 700;
        }

        p {
            margin: 0;
            font-size: 15px;
            line-height: 1.5;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="check" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <h1>Email confirmed</h1>
        <p>Your account is ready. You can close this page and sign in.</p>
    </main>
</body>
</html>
